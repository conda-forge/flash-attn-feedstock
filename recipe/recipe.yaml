schema_version: 1

context:
  version: "3.0.0"
  build_number: 0
  source_rev: 0251105a2fb19d2957484b7f023cd8c115286ced
  cutlass_rev: 7127592069c2fe01b041e174ba4345ef9b279671
  cuda_build_string: cuda_${{ cuda_compiler_version | default("None") | version_to_buildstring }}

package:
  name: flash-attn-3
  version: ${{ version }}

source:
  # FlashAttention-3 is versioned independently inside the flash-attention
  # repository. This is the exact source revision used by the successful
  # 2026-08-17 flash-attention3-wheels release builds; upstream also tags it as
  # fa4-v4.0.0.beta27.
  - url: https://github.com/Dao-AILab/flash-attention/archive/${{ source_rev }}.tar.gz
    sha256: 633428c95fed01f90969e6f8a4ec729eef0e3ccedfff03b9422a85bfb7cd0130
    patches:
      - 0001-respect-offline-builds.patch
      - 0002-trim-runtime-requirements.patch
      # Remove once upstream makes per-kernel resource logging opt-in.
      - 0003-reduce-compiler-logging.patch
  - url: https://github.com/NVIDIA/cutlass/archive/${{ cutlass_rev }}.tar.gz
    sha256: 12baa9c2bf22eaca065b5e55387c21bb4ac742992a6ecd2dd1d3b016dfd25a0a
    target_directory: csrc/cutlass

build:
  number: ${{ build_number }}
  # Upstream declares this extension Unix-only. The available Windows wheel
  # builds apply separate source, CUTLASS, and CUDA-header patches.
  skip:
    - not linux or cuda_compiler_version == "None"
    - is_abi3 and not is_python_min
  string: ${{ cuda_build_string }}_py${{ python_min | version_to_buildstring }}h${{ hash }}_${{ build_number }}
  # hopper/setup.py builds _C with Py_LIMITED_API and py_limited_api=True.
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      FLASH_ATTENTION_FORCE_BUILD: "TRUE"
      FLASH_ATTENTION_OFFLINE_BUILD: "TRUE"
      # Keep compilation below the runner's full CPU count to leave memory
      # headroom for the large CUDA translation units.
      MAX_JOBS: "4"
      NVCC_THREADS: "1"
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ninja
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
        - pytorch
        - pytorch * cuda*
    - ${{ compiler('cuda') }}
  host:
    - packaging
    - pip
    - if: is_abi3
      then: python-abi3
    # Keep the build interpreter at the advertised ABI floor. PyTorch's
    # dependency constraints can otherwise make the solver choose a newer one.
    - python ${{ python_min }}.*
    - pytorch
    - setuptools
    - wheel
    - cuda-version ==${{ cuda_compiler_version }}
    - cuda-driver-dev
    - cuda-cudart-dev
    - pytorch * cuda*
  run:
    - python
    - pytorch * cuda*

tests:
  - package_contents:
      files:
        - site-packages/flash_attn_3/__init__.py
        - site-packages/flash_attn_3/_C*.so
        - site-packages/flash_attn_config.py
        - site-packages/flash_attn_interface.py
  # Cross-built AArch64 Python cannot execute on the x86_64 runner.
  - if: build_platform == target_platform
    then:
      - python:
          imports:
            - flash_attn_3
            - flash_attn_3._C
            - flash_attn_3.flash_attn_interface
            - flash_attn_config
            - flash_attn_interface
          pip_check: true
          python_version:
            - if: is_abi3
              then: ${{ python_min }}.*
            - "*"
      - if: is_abi3
        then:
          requirements:
            run:
              - abi3audit
          script:
            - abi3audit $SP_DIR/flash_attn_3/_C.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      - files:
          recipe:
            - test_coinstall.py
        requirements:
          run:
            - flash-attn >=2,<3
            - pip
            - python ${{ python_min }}.*
        script:
          - python test_coinstall.py
          - pip check

about:
  homepage: https://github.com/Dao-AILab/flash-attention
  repository: https://github.com/Dao-AILab/flash-attention
  summary: FlashAttention-3 CUDA kernels optimized for NVIDIA Hopper GPUs
  description: >-
    FlashAttention-3 provides fast and memory-efficient attention kernels for
    NVIDIA Hopper GPUs. Upstream officially supports H100 and H800 GPUs.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - csrc/cutlass/LICENSE.txt

extra:
  feedstock-name: flash-attn
  recipe-maintainers:
    - carterbox
    - weiji14
    - jeongseok-meta
